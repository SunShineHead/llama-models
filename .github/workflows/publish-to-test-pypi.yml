name: Publish Python 🐍 distribution 📦 to TestPyPI

on:
  repository_dispatch:  # on trigger from llama-stack
    types: [build-models-package]
  
  workflow_dispatch:  # Keep manual trigger
    inputs:
      version:
        description: 'Version number (e.g. 0.0.63.dev20250111)'
        required: true
        type: string

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set distribution version
      if: >-
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'repository_dispatch' &&
        github.event.client_payload.source == 'llama-stack-nightly')
      env:
        RELEASE_VERSION: ${{ inputs.version || github.event.client_payload.version }}
      shell: bash
      run: |
        if [[ ! "$RELEASE_VERSION" =~ ^[0-9][0-9A-Za-z.!+_-]*$ ]]; then
          printf 'Invalid distribution version\n' >&2
          exit 1
        fi
        grep -Eq '^version = "[^"]*"$' pyproject.toml
        sed -i -E 's/^version = "[^"]*"$/version = "'"$RELEASE_VERSION"'"/' pyproject.toml
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testrelease
      url: https://test.pypi.org/p/llama-models

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
